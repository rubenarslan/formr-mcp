[project]
name = "formr-mcp"
version = "0.1.0"
description = "A MCP Server for the formr.org survey framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.27.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# tests/test_integration_runs.py creates and deletes runs on the formr of the
# .env: only with `-m integration`
addopts = "-m 'not integration'"
